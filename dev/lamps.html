<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vivid badges preview</title>
    <link rel="icon" href="data:," />
    <style>
      :root[data-theme='dark'] {
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --secondary-background-color: #282828;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --rgb-primary-text-color: 225, 225, 225;
        --primary-color: #03a9f4;
        --divider-color: rgba(225, 225, 225, 0.12);
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --primary-background-color: #fafafa;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --secondary-background-color: #e5e5e5;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --rgb-primary-text-color: 33, 33, 33;
        --primary-color: #03a9f4;
        --divider-color: rgba(0, 0, 0, 0.12);
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 16px;
      }
      .toolbar button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--card-background-color);
        color: var(--primary-text-color);
        cursor: pointer;
      }
      .toolbar span {
        color: var(--secondary-text-color);
        font-size: 13px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 4px 16px 420px;
        max-width: 420px;
      }
      .stage h2 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--secondary-text-color);
      }
      .stage h3 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
      }
      section + section {
        margin-top: 16px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      /* Close to Home Assistant's own entity badge, for comparison. */
      .native {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 12px 0 8px;
        border-radius: 18px;
        background: var(--ha-card-background);
        border: 1px solid var(--divider-color);
        font-size: 12px;
        font-weight: 500;
      }
      .native ha-icon {
        --mdc-icon-size: 18px;
      }
      .stage {
        max-width: 440px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span>Vivid lamp group</span>
    </div>
    <main class="stage" id="stage"></main>
    <script type="module" src="./lamps.ts"></script>
  </body>
</html>
