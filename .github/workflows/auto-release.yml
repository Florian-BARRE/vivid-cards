name: Auto release

# A version in package.json without a matching tag means a release is due:
# check, build, create the release with the changelog entry and attach
# vivid-cards.js, which HACS installs. Releases created here do not trigger the
# Release workflow (GitHub does not chain workflows on the built-in token), so
# the bundle is attached here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "v${version} is already released."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.due == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.due == 'true'
        run: npm ci
      - if: steps.version.outputs.due == 'true'
        run: npm run check
      - name: Release notes from the changelog
        if: steps.version.outputs.due == 'true'
        run: |
          version="${{ steps.version.outputs.tag }}"
          awk -v version="${version#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for ${version}" >&2
            exit 1
          fi
      - name: Create the release
        if: steps.version.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/vivid-cards.js \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
