name: HACS validation

# HACS installs the bundle from a GitHub release asset, so the check only makes
# sense once a release exists: it runs on each published release and on demand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # Brands only apply to integrations.
          ignore: brands
